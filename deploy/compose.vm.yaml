services:
  api:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: custos-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/custos_asset_hub.db
      CHAIN_ID: ${CHAIN_ID:-91342}
      NETWORK_NAME: ${NETWORK_NAME:-Target L2}
      RPC_URL: ${RPC_URL:-https://sepolia-rpc.giwa.io}
      EXPLORER_URL: ${EXPLORER_URL:-https://sepolia-explorer.giwa.io}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      ADMIN_REVIEW_KEY: ${ADMIN_REVIEW_KEY:-}
    ports:
      - "8000:8080"
    volumes:
      - ../runtime-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        NGINX_CONFIG: deploy/nginx.vm.conf
        VITE_API_BASE: ${VITE_API_BASE}
        VITE_CHAIN_ID: ${VITE_CHAIN_ID:-91342}
        VITE_NETWORK_URL: ${VITE_NETWORK_URL:-https://sepolia-rpc.giwa.io}
    container_name: custos-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:8080"
